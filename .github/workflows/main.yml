name: Build -> Push -> Deploy Cartly

on:
  push:
    branches:
      - master      

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Build Spring Boot Application
      - name: Build JAR
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cartly:latest .

      # 6. Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cartly:latest

      # 7. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "Stopping old containers..."

            docker stop spring-demo || true
            docker rm -f spring-demo || true

            docker stop stripe-payment-app || true
            docker rm -f stripe-payment-app || true

            docker stop cartly-app || true
            docker rm -f cartly-app || true

            echo "Pulling latest image..."

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cartly:latest

            echo "Starting Cartly..."

            docker run -d \
              --name cartly-app \
              --restart always \
              -p 8080:8080 \
              -e STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
              -e APP_BASE_URL="${{ secrets.APP_BASE_URL }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/cartly:latest

            echo "Running Containers"

            docker ps
