<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — Cartly</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system.css">
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    .pd-layout{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:40px 0}
    .pd-gallery{position:relative}
    .pd-main-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--radius-xl);background:var(--gray-100);cursor:zoom-in;transition:transform .3s}
    .pd-main-img:hover{transform:scale(1.02)}
    .pd-thumbs{display:flex;gap:12px;margin-top:16px}
    .pd-thumb{width:72px;height:72px;object-fit:cover;border-radius:var(--radius);border:2px solid transparent;cursor:pointer;transition:var(--transition);background:var(--gray-100)}
    .pd-thumb.active,.pd-thumb:hover{border-color:var(--primary)}
    .pd-info{padding:8px 0}
    .pd-badge{margin-bottom:12px}
    .pd-title{font-size:2rem;margin-bottom:8px}
    .pd-rating{display:flex;align-items:center;gap:8px;margin-bottom:20px}
    .pd-rating .count{font-size:.85rem;color:var(--gray-500)}
    .pd-price{font-size:2rem;font-weight:800;color:var(--primary);margin-bottom:24px}
    .pd-desc{color:var(--gray-600);line-height:1.8;margin-bottom:28px;font-size:.95rem}
    .pd-specs{margin-bottom:28px}
    .pd-specs h3{margin-bottom:12px}
    .spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .spec-item{display:flex;justify-content:space-between;padding:10px 14px;background:var(--gray-50);border-radius:var(--radius);font-size:.85rem}
    .spec-item .label{color:var(--gray-500)}
    .spec-item .value{font-weight:600}
    .pd-qty{display:flex;align-items:center;gap:16px;margin-bottom:24px}
    .pd-actions{display:flex;gap:12px;margin-bottom:24px}
    .pd-meta{display:flex;gap:24px;padding:20px 0;border-top:1px solid var(--gray-200)}
    .pd-meta-item{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--gray-600)}
    .pd-meta-item svg{width:18px;height:18px;color:var(--primary)}

    .reviews-section{padding:48px 0}
    .review-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
    .review-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .review-author{font-weight:600;font-size:.9rem}
    .review-date{font-size:.75rem;color:var(--gray-400)}
    .review-body{font-size:.9rem;color:var(--gray-600);line-height:1.7}

    .related-section{padding:48px 0}
    .related-section .grid{grid-template-columns:repeat(4,1fr)}

    @media(max-width:768px){
      .pd-layout{grid-template-columns:1fr;gap:24px}
      .pd-title{font-size:1.5rem}
      .pd-price{font-size:1.5rem}
      .spec-grid{grid-template-columns:1fr}
      .related-section .grid{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
  <div id="navbar-mount"></div>
  <main>
    <div class="container">
      <div class="pd-layout" id="pd-layout"></div>
    </div>
    <div class="container" id="reviews-section"></div>
    <div class="container" id="related-section"></div>
  </main>
  <div id="footer-mount"></div>

  <script src="/js/store.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('navbar-mount').innerHTML = renderNavbar('');
    document.getElementById('footer-mount').innerHTML = renderFooter();
    initNavbar();

    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const product = Store.getProduct(productId);

    if (!product) {
      document.getElementById('pd-layout').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><h3>Product not found</h3><p>The product you're looking for doesn't exist.</p><a href="/" class="btn btn-primary" style="margin-top:16px">Back to Shop</a></div>`;
    } else {
      document.title = `${product.name} — Cartly`;
      let qty = 1;
      const specHtml = Object.entries(product.specs).map(([k,v]) => `<div class="spec-item"><span class="label">${k}</span><span class="value">${v}</span></div>`).join('');

      document.getElementById('pd-layout').innerHTML = `
        <div class="pd-gallery slide-up">
          <img src="${product.image}" alt="${product.name}" class="pd-main-img" id="main-img">
          <div class="pd-thumbs">
            <img src="${product.image}" class="pd-thumb active" onclick="document.getElementById('main-img').src=this.src;document.querySelectorAll('.pd-thumb').forEach(t=>t.classList.remove('active'));this.classList.add('active')">
            <img src="${product.image}" class="pd-thumb" style="filter:brightness(1.1)" onclick="document.getElementById('main-img').src=this.src;document.getElementById('main-img').style.filter='brightness(1.1)';document.querySelectorAll('.pd-thumb').forEach(t=>t.classList.remove('active'));this.classList.add('active')">
            <img src="${product.image}" class="pd-thumb" style="filter:saturate(1.4)" onclick="document.getElementById('main-img').src=this.src;document.getElementById('main-img').style.filter='saturate(1.4)';document.querySelectorAll('.pd-thumb').forEach(t=>t.classList.remove('active'));this.classList.add('active')">
          </div>
        </div>
        <div class="pd-info slide-up delay-1">
          <span class="badge badge-primary pd-badge">${product.category}</span>
          <h1 class="pd-title">${product.name}</h1>
          <div class="pd-rating">${renderStars(product.rating)}<span class="count">${product.rating} (${product.reviews} reviews)</span></div>
          <div class="pd-price">${formatPrice(product.price)}</div>
          <p class="pd-desc">${product.description}</p>
          <div class="pd-specs"><h3>Specifications</h3><div class="spec-grid">${specHtml}</div></div>
          <div class="pd-qty">
            <span style="font-weight:600;font-size:.9rem">Quantity:</span>
            <div class="qty-selector">
              <button class="qty-btn" id="qty-dec">−</button>
              <span class="qty-val" id="qty-val">1</span>
              <button class="qty-btn" id="qty-inc">+</button>
            </div>
          </div>
          <div class="pd-actions">
            <button class="btn btn-primary btn-lg" style="flex:1" id="add-to-cart-btn">Add to Cart</button>
            <button class="btn btn-secondary btn-lg" id="buy-now-btn">Buy Now</button>
            <button class="btn btn-outline btn-icon" id="wishlist-btn" title="Add to wishlist" style="width:48px;height:48px">${Store.isInWishlist(productId) ? Icons.heartFill : Icons.heart}</button>
          </div>
          <div class="pd-meta">
            <div class="pd-meta-item">${Icons.truck} Free Shipping</div>
            <div class="pd-meta-item">${Icons.shield} Secure Payment</div>
            <div class="pd-meta-item">${Icons.refresh} 30-Day Returns</div>
          </div>
        </div>
      `;

      // Qty
      document.getElementById('qty-dec').addEventListener('click', () => { if (qty > 1) { qty--; document.getElementById('qty-val').textContent = qty; } });
      document.getElementById('qty-inc').addEventListener('click', () => { qty++; document.getElementById('qty-val').textContent = qty; });

      // Add to cart
      document.getElementById('add-to-cart-btn').addEventListener('click', () => { Store.addToCart(productId, qty); Toast.success(`${product.name} added to cart!`); });

      // Buy now
      document.getElementById('buy-now-btn').addEventListener('click', () => { Store.addToCart(productId, qty); window.location.href = '/cart'; });

      // Wishlist
      document.getElementById('wishlist-btn').addEventListener('click', () => {
        const added = Store.toggleWishlist(productId);
        document.getElementById('wishlist-btn').innerHTML = added ? Icons.heartFill : Icons.heart;
        Toast.show(added ? 'Added to wishlist' : 'Removed from wishlist', added ? 'success' : 'info');
      });

      // Reviews
      const reviews = [
        { author: 'Amit P.', date: 'Jul 2026', rating: 5, text: 'Excellent quality! Exceeded my expectations. The build quality is superb and performance is outstanding.' },
        { author: 'Sara L.', date: 'Jun 2026', rating: 4, text: 'Great product overall. Shipping was fast and the packaging was premium. Would recommend to anyone.' },
        { author: 'Dev R.', date: 'Jun 2026', rating: 5, text: 'Best purchase I\'ve made this year. The attention to detail is impressive. Works perfectly for my needs.' },
      ];
      document.getElementById('reviews-section').innerHTML = `
        <div class="reviews-section">
          <h2 style="margin-bottom:24px">Customer Reviews</h2>
          ${reviews.map(r => `<div class="review-card"><div class="review-header"><div><span class="review-author">${r.author}</span> <span style="margin-left:8px">${renderStars(r.rating)}</span></div><span class="review-date">${r.date}</span></div><p class="review-body">${r.text}</p></div>`).join('')}
        </div>`;

      // Related products
      const related = Store.getProducts().filter(p => p.id !== productId).slice(0, 4);
      document.getElementById('related-section').innerHTML = `
        <div class="related-section">
          <h2 style="margin-bottom:24px">You May Also Like</h2>
          <div class="grid" style="grid-template-columns:repeat(4,1fr)">
            ${related.map(p => `
              <div class="product-card" onclick="window.location.href='/product?id=${p.id}'">
                <div class="product-img-wrap"><img src="${p.image}" alt="${p.name}" class="product-img" loading="lazy"><button class="quick-add" onclick="event.stopPropagation();Store.addToCart('${p.id}');Toast.success('Added!')">${Icons.plus}</button></div>
                <div class="product-info"><div class="product-category">${p.category}</div><div class="product-name">${p.name}</div><div class="product-price">${formatPrice(p.price)}</div></div>
              </div>`).join('')}
          </div>
        </div>`;
    }
  </script>
</body>
</html>
