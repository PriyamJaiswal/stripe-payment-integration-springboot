<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Cartly</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system.css">
  <style>
    .profile-layout{display:grid;grid-template-columns:260px 1fr;gap:32px;padding:40px 0 60px}
    .profile-nav{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:8px;height:fit-content;position:sticky;top:calc(var(--nav-h)+24px)}
    .profile-nav-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--radius);font-size:.9rem;font-weight:500;cursor:pointer;transition:var(--transition);color:var(--gray-600)}
    .profile-nav-item:hover{background:var(--gray-100);color:var(--primary)}
    .profile-nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
    .profile-nav-item svg{width:20px;height:20px}
    .profile-tab{display:none}.profile-tab.active{display:block}
    .profile-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px}
    .avatar-section{display:flex;align-items:center;gap:20px;margin-bottom:24px}
    .avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#60a5fa);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:var(--white)}
    .avatar-info h2{margin-bottom:2px;font-size:1.25rem}
    .avatar-info p{color:var(--gray-500);font-size:.85rem}
    .profile-form .form-group{margin-bottom:16px}
    .addr-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .addr-manage-card{padding:16px;border:1px solid var(--gray-200);border-radius:var(--radius-lg);position:relative}
    .addr-manage-card .name{font-weight:600;margin-bottom:4px}
    .addr-manage-card .details{font-size:.85rem;color:var(--gray-600);line-height:1.6}
    .addr-manage-card .actions{display:flex;gap:8px;margin-top:12px}
    .wishlist-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media(max-width:768px){
      .profile-layout{grid-template-columns:1fr}
      .profile-nav{position:static;display:flex;overflow-x:auto;gap:4px}
      .addr-grid{grid-template-columns:1fr}
      .wishlist-grid{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
  <div id="navbar-mount"></div>
  <main>
    <div class="container">
      <div class="profile-layout">
        <nav class="profile-nav slide-up" id="profile-nav"></nav>
        <div id="profile-content" class="slide-up delay-1"></div>
      </div>
    </div>
  </main>
  <div id="footer-mount"></div>

  <script src="/js/store.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('navbar-mount').innerHTML = renderNavbar('');
    document.getElementById('footer-mount').innerHTML = renderFooter();
    initNavbar();

    const tabs = [
      { id: 'profile', label: 'Profile', icon: Icons.user },
      { id: 'addresses', label: 'Addresses', icon: Icons.mapPin },
      { id: 'orders', label: 'Orders', icon: Icons.package },
      { id: 'wishlist', label: 'Wishlist', icon: Icons.heart },
      { id: 'payment', label: 'Payment Methods', icon: Icons.creditCard },
    ];
    let activeTab = 'profile';

    function renderNav() {
      document.getElementById('profile-nav').innerHTML = tabs.map(t =>
        `<div class="profile-nav-item ${activeTab === t.id ? 'active' : ''}" onclick="switchTab('${t.id}')">${t.icon} ${t.label}</div>`
      ).join('') + `<div class="profile-nav-item" onclick="Toast.info('Logged out')" style="color:var(--danger)"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg> Logout</div>`;
    }

    function renderContent() {
      const c = document.getElementById('profile-content');
      if (activeTab === 'profile') {
        c.innerHTML = `<div class="profile-card">
          <div class="avatar-section"><div class="avatar">PJ</div><div class="avatar-info"><h2>Priyam Jaiswal</h2><p>priyam@example.com</p></div></div>
          <div class="profile-form">
            <div class="form-row"><div class="form-group"><label class="form-label">First Name</label><input class="form-input" value="Priyam"></div><div class="form-group"><label class="form-label">Last Name</label><input class="form-input" value="Jaiswal"></div></div>
            <div class="form-group"><label class="form-label">Email</label><input class="form-input" value="priyam@example.com" type="email"></div>
            <div class="form-group"><label class="form-label">Phone</label><input class="form-input" value="+91 98765 43210"></div>
            <button class="btn btn-primary" style="margin-top:8px" onclick="Toast.success('Profile updated!')">Save Changes</button>
          </div>
        </div>`;
      } else if (activeTab === 'addresses') {
        const addrs = Store.getAddresses();
        c.innerHTML = `<div class="profile-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h3>Saved Addresses</h3><a href="/checkout" class="btn btn-primary btn-sm">${Icons.plus} Add New</a></div>
          ${addrs.length === 0 ? '<p class="text-muted">No saved addresses yet. Add one during checkout.</p>' :
          `<div class="addr-grid">${addrs.map(a => `<div class="addr-manage-card">
            ${a.isDefault ? '<span class="badge badge-primary" style="margin-bottom:8px">Default</span>' : ''}
            <div class="name">${a.fullName}</div>
            <div class="details">${a.line}<br>${a.city}, ${a.state} ${a.pin}<br>${a.phone}</div>
            <div class="actions"><button class="btn btn-ghost btn-sm" onclick="Store.deleteAddress('${a.id}');Toast.info('Address deleted');renderContent()">${Icons.trash} Delete</button></div>
          </div>`).join('')}</div>`}
        </div>`;
      } else if (activeTab === 'orders') {
        const orders = Store.getOrders();
        c.innerHTML = `<div class="profile-card">
          <h3 style="margin-bottom:16px">Recent Orders</h3>
          ${orders.length === 0 ? '<p class="text-muted">No orders yet.</p>' :
          orders.slice(0, 5).map(o => `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--gray-100)">
            <div><div style="font-weight:600;font-size:.9rem">${o.id}</div><div style="font-size:.75rem;color:var(--gray-500)">${new Date(o.date).toLocaleDateString()}</div></div>
            <div style="display:flex;align-items:center;gap:12px"><span class="badge badge-primary">${o.status}</span><span style="font-weight:700">${formatPrice(o.total)}</span><a href="/orders?id=${o.id}" class="btn btn-ghost btn-sm">View</a></div>
          </div>`).join('')}
          ${orders.length > 0 ? '<a href="/orders" class="btn btn-outline btn-full" style="margin-top:16px">View All Orders</a>' : ''}
        </div>`;
      } else if (activeTab === 'wishlist') {
        const wl = Store.getWishlist().map(id => Store.getProduct(id)).filter(Boolean);
        c.innerHTML = `<div class="profile-card">
          <h3 style="margin-bottom:16px">My Wishlist (${wl.length})</h3>
          ${wl.length === 0 ? '<p class="text-muted">Your wishlist is empty. Browse products and tap the heart icon.</p>' :
          `<div class="wishlist-grid">${wl.map(p => `<div class="product-card" onclick="window.location.href='/product?id=${p.id}'">
            <div class="product-img-wrap"><img src="${p.image}" alt="${p.name}" class="product-img"></div>
            <div class="product-info"><div class="product-name">${p.name}</div><div class="product-price">${formatPrice(p.price)}</div>
              <div style="display:flex;gap:6px;margin-top:8px">
                <button class="btn btn-primary btn-sm" style="flex:1" onclick="event.stopPropagation();Store.addToCart('${p.id}');Toast.success('Added to cart!')">Add to Cart</button>
                <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();Store.toggleWishlist('${p.id}');Toast.info('Removed');renderContent()">${Icons.trash}</button>
              </div>
            </div>
          </div>`).join('')}</div>`}
        </div>`;
      } else if (activeTab === 'payment') {
        c.innerHTML = `<div class="profile-card">
          <h3 style="margin-bottom:16px">Payment Methods</h3>
          <div style="padding:20px;border:1px solid var(--gray-200);border-radius:var(--radius-lg);display:flex;align-items:center;gap:16px;margin-bottom:12px">
            <div style="width:48px;height:32px;background:linear-gradient(135deg,#1a1f71,#004b87);border-radius:6px;display:flex;align-items:center;justify-content:center;color:white;font-size:.7rem;font-weight:700">VISA</div>
            <div style="flex:1"><div style="font-weight:600;font-size:.9rem">•••• •••• •••• 4242</div><div style="font-size:.75rem;color:var(--gray-500)">Expires 12/28</div></div>
            <span class="badge badge-primary">Default</span>
          </div>
          <p style="font-size:.85rem;color:var(--gray-500);margin-top:12px;display:flex;align-items:center;gap:6px">${Icons.shield} Cards are securely stored by Stripe. We never see your full card details.</p>
        </div>`;
      }
    }

    function switchTab(id) { activeTab = id; renderNav(); renderContent(); }

    renderNav();
    renderContent();
  </script>
</body>
</html>
