<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist — Cartly</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system.css">
</head>

<body>
  <div id="navbar-mount"></div>
  <main>
    <div class="container section">
      <h1 class="slide-up" style="margin-bottom:8px">My Wishlist</h1>
      <p class="text-muted slide-up" id="wl-count"></p>
      <div class="grid grid-4" id="wl-grid" style="margin-top:24px"></div>
    </div>
  </main>
  <div id="footer-mount"></div>

  <script src="/js/store.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('navbar-mount').innerHTML = renderNavbar('');
    document.getElementById('footer-mount').innerHTML = renderFooter();
    initNavbar();

    function renderWishlist() {
      const wl = Store.getWishlist().map(id => Store.getProduct(id)).filter(Boolean);
      document.getElementById('wl-count').textContent = `${wl.length} item${wl.length !== 1 ? 's' : ''} saved`;
      const grid = document.getElementById('wl-grid');

      if (wl.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
          <div style="width:80px;height:80px;margin:0 auto 16px;color:var(--gray-300)">${Icons.heart}</div>
          <h3>Your wishlist is empty</h3><p>Save products, you love by clicking the heart icon.</p>
          <a href="/" class="btn btn-primary btn-lg" style="margin-top:16px">Browse Products</a>
        </div>`;
        return;
      }

      grid.innerHTML = wl.map((p, i) => `
        <div class="product-card slide-up delay-${i % 4 + 1}">
          <div class="product-img-wrap" onclick="window.location.href='/product?id=${p.id}'" style="cursor:pointer">
            <img src="${p.image}" alt="${p.name}" class="product-img">
          </div>
          <div class="product-info">
            <div class="product-category">${p.category}</div>
            <div class="product-name">${p.name}</div>
            <div class="product-price">${formatPrice(p.price)}</div>
            <div style="display:flex;gap:8px;margin-top:12px">
              <button class="btn btn-primary btn-sm" style="flex:1" onclick="Store.addToCart('${p.id}');Toast.success('Added to cart!')">Add to Cart</button>
              <button class="btn btn-outline btn-sm" onclick="Store.toggleWishlist('${p.id}');Toast.info('Removed');renderWishlist()">${Icons.trash}</button>
            </div>
          </div>
        </div>`).join('');
    }

    renderWishlist();
  </script>
</body>

</html>
