<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Cartly</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system.css">
  <style>
    .success-page{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
    .success-card{background:var(--white);border-radius:var(--radius-xl);padding:48px;max-width:560px;width:100%;text-align:center;box-shadow:var(--shadow-xl);animation:scaleIn .5s ease}
    .success-icon{width:96px;height:96px;margin:0 auto 24px;background:var(--success-light);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .success-icon svg{width:48px;height:48px;color:var(--success)}
    .success-check{stroke-dasharray:100;stroke-dashoffset:100;animation:checkmark .6s ease .3s forwards}
    .success-card h1{font-size:1.75rem;margin-bottom:8px;color:var(--success)}
    .success-card .subtitle{color:var(--gray-500);margin-bottom:28px;font-size:.95rem}
    .order-info{background:var(--gray-50);border-radius:var(--radius-lg);padding:20px;margin-bottom:24px;text-align:left}
    .order-info-row{display:flex;justify-content:space-between;padding:8px 0;font-size:.9rem}
    .order-info-row .label{color:var(--gray-500)}
    .order-info-row .value{font-weight:600}
    .success-actions{display:flex;flex-direction:column;gap:10px}
  </style>
</head>
<body>
  <div id="navbar-mount"></div>
  <main>
    <div class="success-page">
      <div class="success-card">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.75l6 6 9-13.5" class="success-check"/></svg>
        </div>
        <h1>Order Confirmed!</h1>
        <p class="subtitle">Thank you for your purchase. Your order has been placed successfully.</p>
        <div class="order-info" id="order-info"></div>
        <div class="success-actions">
          <a href="/orders" class="btn btn-primary btn-full btn-lg">View Order History</a>
          <button class="btn btn-outline btn-full" onclick="Toast.success('Invoice downloaded!')">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
            Download Invoice
          </button>
          <a href="/" class="btn btn-ghost btn-full">Continue Shopping</a>
        </div>
      </div>
    </div>
  </main>
  <div id="footer-mount"></div>

  <script src="/js/store.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('navbar-mount').innerHTML = renderNavbar('');
    document.getElementById('footer-mount').innerHTML = renderFooter();
    initNavbar();

    // Clear cart after successful payment
    Store.clearCart();

    const lastOrderId = localStorage.getItem('lastOrderId');
    const order = lastOrderId ? Store.getOrder(lastOrderId) : null;
    const orderInfo = document.getElementById('order-info');

    if (order) {
      const deliveryDate = new Date();
      deliveryDate.setDate(deliveryDate.getDate() + (order.shipping?.id === 'express' ? 3 : order.shipping?.id === 'sameday' ? 0 : 7));
      orderInfo.innerHTML = `
        <div class="order-info-row"><span class="label">Order Number</span><span class="value">${order.id}</span></div>
        <div class="order-info-row"><span class="label">Date</span><span class="value">${new Date(order.date).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' })}</span></div>
        <div class="order-info-row"><span class="label">Items</span><span class="value">${order.items.length} product${order.items.length > 1 ? 's' : ''}</span></div>
        <div class="order-info-row"><span class="label">Total</span><span class="value" style="color:var(--primary)">${formatPrice(order.total)}</span></div>
        <div class="order-info-row"><span class="label">Est. Delivery</span><span class="value">${deliveryDate.toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' })}</span></div>
        <div class="order-info-row"><span class="label">Payment</span><span class="value"><span class="badge badge-success">Paid</span></span></div>
      `;
    } else {
      orderInfo.innerHTML = `
        <div class="order-info-row"><span class="label">Status</span><span class="value"><span class="badge badge-success">Payment Successful</span></span></div>
        <div class="order-info-row"><span class="label">Message</span><span class="value">Your payment has been processed.</span></div>
      `;
    }
  </script>
</body>
</html>
